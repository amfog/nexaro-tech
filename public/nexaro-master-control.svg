<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="mc-border" x1="0" y1="0" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="mc-glow-bg" cx="50%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="mc-glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Gradient border -->
  <rect width="240" height="160" rx="12" fill="url(#mc-border)"/>
  <!-- Dark inner bg -->
  <rect x="2" y="2" width="236" height="156" rx="10" fill="#0A0E27"/>
  <!-- Radial glow -->
  <ellipse cx="120" cy="80" rx="55" ry="40" fill="url(#mc-glow-bg)"/>

  <!-- Product code -->
  <text x="120" y="22" text-anchor="middle" fill="#6B7280" font-size="9" font-family="monospace" letter-spacing="1.5">NX-008.M</text>
  <!-- Product name -->
  <text x="120" y="42" text-anchor="middle" fill="white" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">Command Center</text>

  <!-- 2x2 dashboard grid icon centered at (120, 72) -->
  <!-- Top-left square (bright, primary) -->
  <rect x="103" y="55" width="14" height="14" rx="2" fill="rgba(255,215,0,0.18)" stroke="#FFD700" stroke-width="1.5" filter="url(#mc-glow)"/>
  <!-- Top-right square -->
  <rect x="123" y="55" width="14" height="14" rx="2" fill="rgba(255,215,0,0.10)" stroke="#FFD700" stroke-width="1" opacity="0.75"/>
  <!-- Bottom-left square -->
  <rect x="103" y="75" width="14" height="14" rx="2" fill="rgba(255,215,0,0.10)" stroke="#FFD700" stroke-width="1" opacity="0.75"/>
  <!-- Bottom-right square (dimmed) -->
  <rect x="123" y="75" width="14" height="14" rx="2" fill="rgba(255,215,0,0.06)" stroke="#FFD700" stroke-width="1" opacity="0.5"/>

  <!-- Center dot at grid intersection -->
  <circle cx="120" cy="72" r="2.5" fill="#FFD700" opacity="0.9" filter="url(#mc-glow)"/>

  <!-- Connection to subtitle -->
  <line x1="120" y1="89" x2="120" y2="99" stroke="#FFD700" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>

  <!-- Subtitle -->
  <text x="120" y="148" text-anchor="middle" fill="#FFD700" font-size="9" font-family="monospace" letter-spacing="0.5">Master Control</text>
</svg>
